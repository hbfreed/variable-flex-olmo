readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "megablocks[all] @ git+https://github.com/hbfreed/megablocks-variable.git",
    "accelerate>=1.12.0",
    "bitsandbytes>=0.49.1",
    "datasets>=4.4.2",
    "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.9cxx11abiTRUE-cp312-cp312-linux_x86_64.whl",
    "hf-transfer>=0.1.9",
    "liger-kernel>=0.6.4",
    "safetensors>=0.5.0",
    "torch>=2.9,<2.10",
    "transformers>=4.57.3,<5",
    "wandb>=0.23.1",
    "zstandard>=0.25.0",
    "lm-eval[api,math]>=0.4.9.2",
]
